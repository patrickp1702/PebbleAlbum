<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C74FF"/>
      <stop offset="1" stop-color="#4A42D4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF0FF"/>
      <stop offset="1" stop-color="#D7DBFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A1438" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- Back photo (tilted) -->
  <g transform="rotate(-9 512 512)" filter="url(#sh)">
    <rect x="300" y="298" width="430" height="430" rx="40" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Front photo card -->
  <g filter="url(#sh)">
    <rect x="286" y="300" width="452" height="452" rx="44" fill="#ffffff"/>
    <!-- inner image: sky, sun, mountains -->
    <clipPath id="inner"><rect x="318" y="332" width="388" height="388" rx="22"/></clipPath>
    <g clip-path="url(#inner)">
      <rect x="318" y="332" width="388" height="388" fill="url(#sky)"/>
      <circle cx="430" cy="452" r="52" fill="#FFC65C"/>
      <path d="M318 660 L432 520 L520 612 L612 470 L706 612 L706 720 L318 720 Z" fill="#6C63FF"/>
      <path d="M318 700 L408 612 L470 668 L560 560 L706 700 L706 720 L318 720 Z" fill="#4A42D4" opacity="0.85"/>
    </g>
  </g>
</svg>
